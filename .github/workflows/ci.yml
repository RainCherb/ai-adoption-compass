name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Линтер
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Типы
        run: mypy
      - name: Линтеры workflow и Dockerfile
        if: matrix.python == '3.12'
        run: |
          pip install actionlint-py hadolint-py
          actionlint
          hadolint Dockerfile
      - name: Тесты и покрытие
        run: pytest --cov-report=xml
      - name: Контракт OpenAPI актуален
        run: python scripts/export_openapi.py --check
      - name: Свежесть каталога моделей (информационно)
        run: compass catalog check || true
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (Node 24)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker-образ
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Сборка
        run: docker build -t ai-adoption-compass:ci .
      - name: Запуск и проверка здоровья
        run: |
          docker run -d --name compass -p 8000:8000 ai-adoption-compass:ci
          # docker-proxy принимает соединение раньше, чем приложение готово, поэтому повторяем любые ошибки
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -qi "<div id=\"root\""
      - name: Журнал контейнера
        if: always()
        run: docker logs compass || true
      - name: Публичный demo mode — HTTP smoke
        run: |
          docker run -d --name compass-demo -e COMPASS_DEMO_MODE=1 -e PORT=8010 -p 8001:8010 ai-adoption-compass:ci
          python3 scripts/smoke_demo.py --base-url http://127.0.0.1:8001
      - name: Журнал demo-контейнера
        if: always()
        run: docker logs compass-demo || true
