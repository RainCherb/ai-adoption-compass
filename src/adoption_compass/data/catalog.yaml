version: 1
as_of: 2026-10-25
data_status: illustrative
disclaimer: >-
  11 моделей с проверенными тарифами: 5 российских (YandexGPT Pro 5.1, Alice AI LLM, GigaChat 2 Max,
  Pro и Lite) и 6 зарубежных (Claude Sonnet 5.5 и Haiku 5.5, GPT-6.1 Sol и GPT-6 Luna, DeepSeek V4.1
  Flash и V4 Pro). Цены и лимиты сверены с официальными страницами провайдеров 25.10.2026: рублёвые
  тарифы включают НДС 22 %, долларовые — без налогов и пересчитываются по курсу из допущений. Оценки
  качества 1–5, доля автоматизации, экономия и ROI — экспертные допущения, а не измеренные гарантии.

