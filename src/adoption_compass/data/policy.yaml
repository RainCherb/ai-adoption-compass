version: 1
updated: 2026-10-24
disclaimer: >-
  Политика — шаблон, который нужно адаптировать под компанию. Она не является юридической
  консультацией: согласуйте правила с юристом и специалистом по информационной безопасности.

classes:
  public:
    label: Публичные
    description: Информация, которую компания уже опубликовала или готова опубликовать.
    examples:
      - Тексты сайта и каталогов
      - Пресс-релизы и публичные прайс-листы
      - Открытая документация продукта
  internal:
    label: Внутренние
    description: Рабочие материалы без персональных данных и коммерческой тайны.
    examples:
      - Регламенты и внутренние инструкции
      - Шаблоны писем и презентаций
      - Обезличенные отчёты по процессам
  confidential:
    label: Конфиденциальные
    description: Коммерческая тайна, финансовые и договорные данные, исходный код, доступы.
    examples:
      - Условия договоров и коммерческие предложения
      - Финансовая отчётность и себестоимость
      - Исходный код и инфраструктурные схемы
  personal:
    label: Персональные
    description: >-
      Любая информация, относящаяся к физическому лицу: ФИО, телефон, e-mail, паспорт, СНИЛС,
      ИНН, адрес, данные карты.
    examples:
      - Обращения клиентов с контактами
      - Резюме кандидатов и кадровые документы
      - Выгрузки из CRM с данными покупателей

deployments:
  ru_cloud:
    label: Российское облако
    description: Модель работает у российского провайдера, обработка идёт на территории РФ.
  foreign_cloud:
    label: Зарубежное облако
    description: Модель работает у иностранного провайдера, данные обрабатываются за рубежом.
  self_hosted:
    label: Свой контур (self-hosted)
    description: Открытая модель на серверах компании или в арендованном закрытом контуре.

actions:
  allow: Можно отправлять как есть.
  mask: Можно только после обезличивания — идентификаторы заменяются метками.
  deny: Нельзя отправлять в этот контур.

matrix:
  public:
    ru_cloud: allow
    foreign_cloud: allow
    self_hosted: allow
  internal:
    ru_cloud: allow
    foreign_cloud: mask
    self_hosted: allow
  confidential:
    ru_cloud: mask
    foreign_cloud: deny
    self_hosted: allow
  personal:
    ru_cloud: mask
    foreign_cloud: deny
    self_hosted: allow

# Оценка «безопасности» размещения для ранжирования моделей (0..1).
safety_scores:
  public:
    ru_cloud: 1.0
    foreign_cloud: 1.0
    self_hosted: 1.0
  internal:
    ru_cloud: 0.9
    foreign_cloud: 0.6
    self_hosted: 1.0
  confidential:
    ru_cloud: 0.7
    foreign_cloud: 0.2
    self_hosted: 1.0
  personal:
    ru_cloud: 0.7
    foreign_cloud: 0.1
    self_hosted: 1.0

secrets:
  action: deny
  message: >-
    Найдены секреты (ключи, токены, пароли). Их нельзя передавать ни в одну модель:
    удалите их из текста и перевыпустите скомпрометированные ключи.

do:
  - Перед отправкой в нейросеть определите категорию данных — публичные, внутренние, конфиденциальные или персональные.
  - Заменяйте имена, телефоны, e-mail и реквизиты метками ([PERSON_1], [PHONE_1]) — для этого есть режим обезличивания.
  - Работайте через корпоративные аккаунты и сервисы, одобренные компанией.
  - Проверяйте факты, цифры, ссылки и юридические формулировки в ответах модели — она может уверенно ошибаться.
  - Просите модель указывать источники и допущения, а удачные промпты сохраняйте в общей библиотеке.
  - Для персональных и конфиденциальных данных выбирайте только модели, допустимые по матрице.

dont:
  - Не вставляйте пароли, ключи API, токены, закрытые ключи и строки подключения к базам данных.
  - Не отправляйте персональные данные и коммерческую тайну в зарубежные облака.
  - Не используйте личные аккаунты, неизвестные боты и расширения браузера для рабочих данных.
  - Не принимайте решения о людях (найм, увольнение, кредит) только на основании ответа модели.
  - Не публикуйте ответ модели без проверки человеком, если от него зависят деньги, право или безопасность.
  - Не обходите ограничения доступа к сервисам способами, нарушающими условия провайдера.
